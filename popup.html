<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; margin: 0; padding: 16px; font: 13px/1.4 system-ui, "Segoe UI", sans-serif; color: #1d2230; }
    h1 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
    h1 img { width: 20px; height: 20px; }
    label { display: block; margin-bottom: 10px; color: #555; }
    input, select { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 7px 9px;
      font: inherit; color: #1d2230; border: 1px solid #d5d9e2; border-radius: 7px; outline: none; }
    input:focus, select:focus { border-color: #4f8cff; }
    .actions { display: flex; gap: 8px; margin-top: 14px; }
    button { flex: 1; padding: 8px; font: inherit; border-radius: 7px; cursor: pointer; border: 1px solid #d5d9e2; background: #f4f6fa; }
    button.primary { background: #4f8cff; color: #fff; border-color: #4f8cff; }
    button:disabled { opacity: .5; cursor: default; }
    #msg { min-height: 1.2em; margin-top: 10px; font-weight: 500; }
    .by { margin-top: 12px; padding-top: 8px; border-top: 1px solid #e6e8ee; font-size: 11px; color: #8a90a0; text-align: center; }
    #msg.ok { color: #1a8a4a; } #msg.err { color: #c83b3f; }
  </style>
</head>
<body>
  <h1><img src="icons/icon32.png" alt="">Dodaj do Mojej Karty</h1>
  <form id="f">
    <label>Nazwa <input id="title" type="text"></label>
    <label>Adres <input id="url" type="text"></label>
    <label id="group-row">Grupa <select id="group"></select></label>
    <div class="actions">
      <button type="button" id="open">Otwórz Moją Kartę</button>
      <button type="submit" id="add" class="primary">Dodaj</button>
    </div>
    <div id="msg"></div>
  </form>
  <div class="by">Moja Karta · autor: Adrian Kretowicz</div>
  <script type="module" src="popup.js"></script>
</body>
</html>
